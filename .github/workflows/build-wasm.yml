name: build-wasm
on: workflow_dispatch
jobs:
  build-wasm:
    runs-on: ubuntu-26.04
    steps:
      - name: Install Prerequisites
        run:  sudo apt-get install -y automake autoconf 

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: "6.0.6"

      - uses: actions/checkout@v4

      - name: Build wasm
        run: |
          cd icu4c/source
          
          #works
          #emconfigure ./configure --enable-static --disable-shared  --disable-tools --disable-tests --disable-samples --disable-extras --with-data-packaging=static
          #emmake make
          
          emconfigure ./configure --without-assembly --enable-static --disable-shared  --disable-tests --disable-samples --disable-extras --with-data-packaging=static CXXFLAGS="-sEXECUTABLE -sNODERAWFS -sSTACK_SIZE=16777216 -sINITIAL_MEMORY=134217728"
          emmake make
